name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            chrome_binary: google-chrome-stable
          - os: macos-latest
            chrome_binary: '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          - os: windows-latest
            chrome_binary: 'C:\Program Files\Google\Chrome\Application\chrome.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install googlechrome --no-progress -y

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build demo subject
        run: python -m torrenzo demo --force
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ matrix.chrome_binary }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-build-${{ matrix.os }}
          path: demo/build/
