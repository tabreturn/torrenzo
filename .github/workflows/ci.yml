name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install googlechrome --no-progress -y

      - name: Find Chrome (Windows)
        if: matrix.os == 'windows-latest'
        id: chrome
        shell: bash
        run: |
          CHROME=$(find "/c/Program Files" "/c/Program Files (x86)" -name chrome.exe -path "*/Google/Chrome/*" 2>/dev/null | head -1)
          echo "path=$CHROME" >> $GITHUB_OUTPUT

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build demo subject
        run: python -m torrenzo demo --force
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ matrix.os == 'windows-latest' && steps.chrome.outputs.path || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-build-${{ matrix.os }}
          path: demo/build/
